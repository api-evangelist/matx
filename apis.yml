name: MatX
description: 'MatX is an AI-hardware company designing specialized semiconductors optimized for large
  language model workloads. Its flagship MatX One chip targets high-throughput, low-latency training,
  inference, and reinforcement learning for large dense and Mixture-of-Experts models, storing weights
  in SRAM to cut latency and reaching over 2,000 output tokens per second on large models. MatX is a
  hardware and research company with no public developer API surface; this profile captures its
  identity, research/blog output, open-source codebases, and domain-security posture. Backed by Jane
  Street, Spark Capital, and Situational Awareness LP.'
